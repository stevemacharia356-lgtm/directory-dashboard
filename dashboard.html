<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directory Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d1b2a'/><text x='50' y='68' font-family='Arial' font-size='42' font-weight='bold' text-anchor='middle' fill='white'>KE</text></svg>">
</head>
<body>
  <div class="dashboard-header">
    <h1>📋 Directory Dashboard</h1>
    <div class="dashboard-nav">
      <button id="navDirectories" class="active" onclick="navigateTo('directories')">Directories</button>
      <button id="navBusiness" onclick="navigateTo('business')">Business Pages</button>
      <button id="navBuild" onclick="navigateTo('build')">Build Status</button>
      <button onclick="logout().then(() => window.location.href='index.html')">Logout</button>
    </div>
  </div>

  <div class="dashboard-content" id="content"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/form-engine.js"></script>
  <script src="js/image-upload.js"></script>
  <script src="js/directories.js"></script>
  <script src="js/listings.js"></script>
  <script src="js/business.js"></script>
  <script src="js/publish.js"></script>

  <script>
    // Navigation state management
    let currentView = 'directories';
    let viewHistory = ['directories'];

    function navigateTo(view) {
      currentView = view;
      viewHistory.push(view);
      
      // Update active nav
      document.getElementById('navDirectories').classList.toggle('active', view === 'directories');
      document.getElementById('navBusiness').classList.toggle('active', view === 'business');
      document.getElementById('navBuild').classList.toggle('active', view === 'build');
      
      // Add browser history entry
      history.pushState({ view: view }, '', '#' + view);
      
      // Load the view
      if (view === 'directories') loadDirectoryList();
      else if (view === 'business') showBusinessList();
      else if (view === 'build') loadBuildStatus();
    }

    function goBack() {
      viewHistory.pop();
      const previousView = viewHistory[viewHistory.length - 1] || 'directories';
      
      document.getElementById('navDirectories').classList.toggle('active', previousView === 'directories');
      document.getElementById('navBusiness').classList.toggle('active', previousView === 'business');
      document.getElementById('navBuild').classList.toggle('active', previousView === 'build');
      
      if (previousView === 'directories') loadDirectoryList();
      else if (previousView === 'business') showBusinessList();
      else if (previousView === 'build') loadBuildStatus();
    }

    // Handle browser back button
    window.addEventListener('popstate', function(e) {
      if (e.state && e.state.view) {
        const view = e.state.view;
        viewHistory.pop();
        document.getElementById('navDirectories').classList.toggle('active', view === 'directories');
        document.getElementById('navBusiness').classList.toggle('active', view === 'business');
        document.getElementById('navBuild').classList.toggle('active', view === 'build');
        
        if (view === 'directories') loadDirectoryList();
        else if (view === 'business') showBusinessList();
        else if (view === 'build') loadBuildStatus();
      }
    });

    function showDirectories() {
      document.getElementById('navDirectories').classList.add('active');
      document.getElementById('navBusiness').classList.remove('active');
      document.getElementById('navBuild').classList.remove('active');
      loadDirectoryList();
    }

    function showBuildStatus() {
      document.getElementById('navDirectories').classList.remove('active');
      document.getElementById('navBusiness').classList.remove('active');
      document.getElementById('navBuild').classList.add('active');
      loadBuildStatus();
    }

    function showBusinessPages() {
      document.getElementById('navDirectories').classList.remove('active');
      document.getElementById('navBusiness').classList.add('active');
      document.getElementById('navBuild').classList.remove('active');
      if (typeof showBusinessList === 'function') showBusinessList();
    }

    document.addEventListener('DOMContentLoaded', () => { 
      loadDirectoryList(); 
      history.replaceState({ view: 'directories' }, '', '#directories');
    });
  </script>
</body>
</html>
