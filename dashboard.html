<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directory Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d1b2a'/><text x='50' y='68' font-family='Arial' font-size='42' font-weight='bold' text-anchor='middle' fill='white'>KE</text></svg>">
</head>
<body>
  <div class="dashboard-header">
    <h1>📋 Directory Dashboard</h1>
    <div class="dashboard-nav">
      <button id="navDirectories" class="active" onclick="navigateTo('directories')">Directories</button>
      <button id="navBusiness" onclick="navigateTo('business')">Business Pages</button>
      <button id="navBuild" onclick="navigateTo('build')">Build Status</button>
      <button onclick="logout().then(() => window.location.href='index.html')">Logout</button>
    </div>
  </div>

  <div class="dashboard-content" id="content"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/form-engine.js"></script>
  <script src="js/image-upload.js"></script>
  <script src="js/directories.js"></script>
  <script src="js/listings.js"></script>
  <script src="js/business.js"></script>
  <script src="js/publish.js"></script>

  <script>
    // Navigation state management
    let currentView = 'directories';
    let currentSubView = null;
    let viewHistory = ['directories'];
    let isNavigating = false;

    // Track if we're in a sub-view (like editing a listing)
    window.isInSubView = function() {
      return currentSubView !== null;
    };

    // Navigate to a main view
    function navigateTo(view, replace = false) {
      if (isNavigating) return;
      isNavigating = true;

      currentView = view;
      currentSubView = null;
      
      if (!replace) {
        viewHistory.push(view);
      }

      // Update active nav
      document.getElementById('navDirectories').classList.toggle('active', view === 'directories');
      document.getElementById('navBusiness').classList.toggle('active', view === 'business');
      document.getElementById('navBuild').classList.toggle('active', view === 'build');

      // Add browser history entry
      if (!replace) {
        history.pushState({ view: view, subView: null, historyIndex: viewHistory.length - 1 }, '', '#' + view);
      } else {
        history.replaceState({ view: view, subView: null, historyIndex: viewHistory.length - 1 }, '', '#' + view);
      }

      // Load the view
      if (view === 'directories') loadDirectoryList();
      else if (view === 'business') showBusinessList();
      else if (view === 'build') loadBuildStatus();

      isNavigating = false;
    }

    // Navigate to a sub-view (like edit listing)
    window.navigateToSubView = function(view, subView, data) {
      if (isNavigating) return;
      isNavigating = true;

      currentView = view;
      currentSubView = subView;
      
      // Push to history
      viewHistory.push(view + '_' + subView);
      
      // Update nav buttons
      document.getElementById('navDirectories').classList.toggle('active', view === 'directories');
      document.getElementById('navBusiness').classList.toggle('active', view === 'business');
      document.getElementById('navBuild').classList.toggle('active', view === 'build');

      // Push state with sub-view info
      history.pushState({ 
        view: view, 
        subView: subView, 
        data: data,
        historyIndex: viewHistory.length - 1 
      }, '', '#' + view + '/' + subView);

      isNavigating = false;
    };

    // Go back function
    function goBack() {
      if (isNavigating) return;
      
      // If we're in a sub-view, go back to the main view
      if (currentSubView) {
        isNavigating = true;
        
        // Reset sub-view
        currentSubView = null;
        
        // Pop the sub-view from history
        viewHistory.pop();
        
        // Get the main view
        const mainView = currentView;
        
        // Update nav
        document.getElementById('navDirectories').classList.toggle('active', mainView === 'directories');
        document.getElementById('navBusiness').classList.toggle('active', mainView === 'business');
        document.getElementById('navBuild').classList.toggle('active', mainView === 'build');

        // Replace history to remove sub-view
        history.replaceState({ 
          view: mainView, 
          subView: null, 
          historyIndex: viewHistory.length - 1 
        }, '', '#' + mainView);

        // Reload the main view
        if (mainView === 'directories') loadDirectoryList();
        else if (mainView === 'business') showBusinessList();
        else if (mainView === 'build') loadBuildStatus();

        isNavigating = false;
        return;
      }

      // If we're at root, stay
      if (viewHistory.length <= 1) {
        return;
      }

      isNavigating = true;
      
      viewHistory.pop();
      const previousView = viewHistory[viewHistory.length - 1] || 'directories';
      
      currentView = previousView;
      currentSubView = null;
      
      document.getElementById('navDirectories').classList.toggle('active', previousView === 'directories');
      document.getElementById('navBusiness').classList.toggle('active', previousView === 'business');
      document.getElementById('navBuild').classList.toggle('active', previousView === 'build');

      history.replaceState({ view: previousView, subView: null, historyIndex: viewHistory.length - 1 }, '', '#' + previousView);

      if (previousView === 'directories') loadDirectoryList();
      else if (previousView === 'business') showBusinessList();
      else if (previousView === 'build') loadBuildStatus();

      isNavigating = false;
    }

    // Handle browser back/forward
    window.addEventListener('popstate', function(e) {
      if (isNavigating) return;
      
      if (e.state && e.state.view) {
        const view = e.state.view;
        const subView = e.state.subView || null;
        const historyIndex = e.state.historyIndex || 0;
        
        if (historyIndex < viewHistory.length - 1) {
          viewHistory = viewHistory.slice(0, historyIndex + 1);
        }
        
        currentView = view;
        currentSubView = subView;
        
        document.getElementById('navDirectories').classList.toggle('active', view === 'directories');
        document.getElementById('navBusiness').classList.toggle('active', view === 'business');
        document.getElementById('navBuild').classList.toggle('active', view === 'build');
        
        if (view === 'directories') {
          if (subView) {
            // Handle sub-view restoration if needed
            loadDirectoryList();
          } else {
            loadDirectoryList();
          }
        } else if (view === 'business') {
          showBusinessList();
        } else if (view === 'build') {
          loadBuildStatus();
        }
      } else {
        const hash = window.location.hash.replace('#', '');
        if (hash && ['directories', 'business', 'build'].includes(hash)) {
          navigateTo(hash, true);
        } else {
          navigateTo('directories', true);
        }
      }
    });

    function showDirectories() {
      navigateTo('directories');
    }

    function showBuildStatus() {
      navigateTo('build');
    }

    function showBusinessPages() {
      navigateTo('business');
    }

    // Expose for other scripts
    window.goBack = goBack;
    window.navigateTo = navigateTo;

    document.addEventListener('DOMContentLoaded', () => { 
      const hash = window.location.hash.replace('#', '');
      if (hash && ['directories', 'business', 'build'].includes(hash)) {
        navigateTo(hash, true);
      } else {
        navigateTo('directories', true);
      }
    });
  </script>
</body>
</html>
